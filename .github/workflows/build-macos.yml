name: Build macOS packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.16.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate assets and behavior
        run: pnpm run verify:assets && pnpm test

      - name: Build DMG and ZIP
        run: pnpm exec electron-builder --mac dmg zip --${{ matrix.arch }}
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CSC_LINK != '' }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Verify signed and notarized app
        if: ${{ env.HAS_MAC_CERT == 'true' }}
        run: |
          APP_PATH=$(find dist -maxdepth 3 -name "Arkpets Desktop Pets.app" -print -quit)
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --verbose --type exec "$APP_PATH"

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: Arkpets-macOS-${{ matrix.arch }}
          path: |
            desktop-app/dist/*-macOS-${{ matrix.arch }}.dmg
            desktop-app/dist/*-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 30
    env:
      HAS_MAC_CERT: ${{ secrets.MAC_CSC_LINK != '' }}
